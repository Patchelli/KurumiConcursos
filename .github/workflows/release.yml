name: Release Docker Image (.NET 9)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish versioned image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prevent overwriting an existing version tag
        env:
          IMAGE: ghcr.io/patchelli/kurumi-concursos-api
          VERSION: ${{ github.ref_name }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Tag $IMAGE:$VERSION already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./KurumiConcursos.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/patchelli/kurumi-concursos-api:${{ github.ref_name }}
            ghcr.io/patchelli/kurumi-concursos-api:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
