services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kurumi_concursos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kurumi_concursos_postgres:/var/lib/postgresql/data

volumes:
  kurumi_concursos_postgres:
